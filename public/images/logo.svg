<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="nhGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6DB343" />
      <stop offset="100%" stop-color="#448025" />
    </linearGradient>
    <linearGradient id="nhGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD15C" />
      <stop offset="100%" stop-color="#E5A617" />
    </linearGradient>
    <linearGradient id="nhLeafAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5B9B37" />
      <stop offset="100%" stop-color="#80C954" />
    </linearGradient>
    <filter id="nhShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- ================= EMBLEM ICON ================= -->
  <g transform="translate(10, 8)" filter="url(#nhShadow)">
    <!-- Golden Sun/Light Radiant Halo Ring (Nour / Light) -->
    <circle cx="32" cy="32" r="30" stroke="url(#nhGoldGrad)" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.85" />
    
    <!-- Outer Decorative Botanical Ring Arc -->
    <path d="M 12 38 C 10 24, 20 10, 36 8 C 48 7, 58 14, 60 26" fill="none" stroke="url(#nhGreenGrad)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Golden Sunburst Starlet Top Accent -->
    <circle cx="32" cy="6" r="3.5" fill="url(#nhGoldGrad)" />

    <!-- Left Sprouting Herbal Leaf -->
    <path d="M 32 54 C 20 50, 12 40, 14 26 C 24 24, 34 34, 32 54 Z" fill="url(#nhGreenGrad)" />
    <!-- Left Leaf Inner Vein -->
    <path d="M 20 34 C 24 38, 28 44, 32 54" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

    <!-- Right Sprouting Herbal Leaf (Larger) -->
    <path d="M 32 54 C 44 48, 52 36, 48 20 C 36 20, 28 32, 32 54 Z" fill="url(#nhLeafAccent)" />
    <!-- Right Leaf Inner Vein -->
    <path d="M 44 28 C 40 36, 36 44, 32 54" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

    <!-- Center Sprout Shoot & Golden Seed -->
    <path d="M 32 54 L 32 24 C 32 20, 34 16, 36 14" fill="none" stroke="url(#nhGoldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="37" cy="13" r="2.5" fill="url(#nhGoldGrad)" />
  </g>

  <!-- ================= BRAND TYPOGRAPHY ================= -->
  <!-- NOURESLAM -->
  <text x="86" y="38" font-family="'Krona One', 'Plus Jakarta Sans', sans-serif" font-size="21" font-weight="800" fill="#1F242C" letter-spacing="1.2">
    NOURESLAM
  </text>
  
  <!-- HERBS Accent Box / Text -->
  <g transform="translate(244, 20)">
    <rect x="0" y="2" width="66" height="22" rx="4" fill="url(#nhGreenGrad)" />
    <text x="33" y="17" font-family="'Krona One', 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">
      HERBS
    </text>
  </g>

  <!-- Subtitle: EGYPTIAN BOTANICAL EXPORT -->
  <text x="87" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#5B9B37" letter-spacing="2.8">
    EGYPTIAN BOTANICAL EXPORT
  </text>

  <!-- Dot Separator + Arabic Tag -->
  <circle cx="242" cy="52" r="1.5" fill="#F8BC26" />
  <text x="248" y="55" font-family="'Cairo', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#808287">
    نور الإسلام
  </text>

  <!-- Baseline Decorative Botanical Line -->
  <line x1="87" y1="63" x2="310" y2="63" stroke="#E5E7EB" stroke-width="1" />
  <line x1="87" y1="63" x2="140" y2="63" stroke="url(#nhGoldGrad)" stroke-width="2" stroke-linecap="round" />
</svg>

